name = "orked-m1-proxy"
main = "worker.js"
compatibility_date = "2026-05-17"
account_id = "e2e30e075a1a8ca9277c1f9df2323695"

# No Workers Logs and no invocation logs: the builder's words stay out of Cloudflare's stored logs.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:5500"
