<div style="min-height: 900px; box-sizing: border-box; background: #F3EEE4; color: #1E1A15; font-family: 'Inter', system-ui, sans-serif; display: flex; justify-content: center; padding: 96px 24px 80px">

        <div style="height: 3px; background: #1E1A15"></div>
        <div style="height: 3px; background: #D9D0C2"></div>
        <div style="height: 3px; background: #D9D0C2"></div>
      </div>
      <p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #6E6458">1 / 3</p>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="#7A2232"></circle>
        <circle cx="15" cy="15" r="9" stroke="#F3EEE4" stroke-opacity="0.55" stroke-width="1"></circle>
        <circle cx="15" cy="15" r="3" fill="#F3EEE4" fill-opacity="0.55"></circle>

    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em; color: #1E1A15">What did you bring to the cellar?</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #5C5348">Do not polish the spark. Corked only needs enough shape to bottle it.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="d-spark-field" style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #6E6458">Your spark</label>
      <textarea id="d-spark-field" rows="3" style="box-sizing: border-box; width: 100%; resize: none; font-family: 'Newsreader', Georgia, serif; font-size: 25px; line-height: 1.45; color: #1E1A15; background: #FBF8F2; border: 1px solid #1E1A15; border-radius: 2px; padding: 20px 22px; box-shadow: 4px 4px 0 #1E1A15">An app for wedding photographers who lose their deposit when couples cancel two days before the shoot.</textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px; padding-top: 28px; border-top: 1px solid #D9D0C2">
      <h2 style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 500; letter-spacing: -0.01em; color: #1E1A15">Is this about a problem someone has, or something you want to make for its own sake?</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <button type="button" style="min-height: 56px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; background: #FBF8F2; border: 1px solid #1E1A15; border-radius: 2px; color: #1E1A15; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 500; text-align: left; cursor: pointer"><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 400; color: #7A2232">A</span>A problem someone has</button>
        <button type="button" style="min-height: 56px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; background: #FBF8F2; border: 1px solid #1E1A15; border-radius: 2px; color: #1E1A15; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 500; text-align: left; cursor: pointer"><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 400; color: #7A2232">B</span>Something to make for its own sake</button>
      </div>
    </div>

  </div>
